<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lux Trips</title>
    <meta
      name="description"
      content="Lux Trips — luxury travel agency. Tailor-made itineraries, exclusive tours, private yachts and jets, villas and world-class hotels."
    />

    <!-- Шрифты первого экрана: начинаем качать сразу, параллельно с JS,
         чтобы заголовок не перерисовывался запасным шрифтом.
         crossorigin обязателен даже для своего сайта — шрифты всегда грузятся в режиме CORS,
         без него preload не совпадёт с настоящим запросом и шрифт скачается дважды -->
    <link rel="preload" href="/fonts/Forum.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Manrope-Regular.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Слои hero: начинаем качать сразу, не дожидаясь JS и React -->
    <link rel="preload" as="image" href="/bgtop/bg_top-3.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/bgtop/bg_top-2.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/bgtop/bg_top-1.webp" type="image/webp" fetchpriority="high" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
